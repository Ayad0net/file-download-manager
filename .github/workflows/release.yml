# Builds the desktop app for every platform and attaches the installers to a draft GitHub Release.
# Trigger: push a version tag (git tag v1.4.0 && git push --tags), or run it manually.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: Linux ARM64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils

      - run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION (run bun run version:bump first)"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy (AppImage) is itself an AppImage: run it without FUSE, and skip its
          # bundled strip, which fails on newer ELF sections (notably on ARM64 runners).
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Download Manager v__VERSION__
          releaseBody: See CHANGELOG.md for what changed in this release.
          releaseDraft: true
          prerelease: false
